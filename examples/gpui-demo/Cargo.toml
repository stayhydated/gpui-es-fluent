[package]
name = "gpui-es-fluent-demo"
version = "0.2.0"
rust-version = "1.98"
edition = "2024"
license = "Unlicense"
publish = false
autobins = false

[[example]]
name = "demo"
path = "src/main.rs"

[dependencies]
es-fluent = "0.19.0"
es-fluent-manager-embedded = "0.19.0"
gpui-kit = "0.6.1"
gpui-es-fluent = { features = [ "component" ], path = "../.." }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
ttf-inter = { default-features = false, features = [ "regular" ], version = "0.1" }
wasm-bindgen = "0.2"

[lib]
crate-type = [ "cdylib", "rlib" ]

[build-dependencies]
es-fluent-build = "0.19.0"

[lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
