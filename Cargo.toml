[package]
name = "gpui-es-fluent"
description = "GPUI global-state integration helpers for es-fluent"
version = "0.1.0"
rust-version = "1.96"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/stayhydated/gpui-es-fluent"
readme = "README.md"

[workspace]
members = [ ".", "examples/gpui-demo", "web", "xtask" ]
resolver = "3"

[workspace.dependencies]
dioxus = { default-features = false, version = "0.7" }
stayhydated-dioxus = { path = "../shared/crates/stayhydated-dioxus" }
stayhydated-site = { path = "../shared/crates/stayhydated-site" }
stayhydated-xtask = { path = "../shared/crates/stayhydated-xtask" }

[features]
component = [ "dep:gpui-component", "dep:thiserror" ]
default = [  ]

[dependencies]
es-fluent = { git = "https://github.com/stayhydated/es-fluent" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }
strum = "0.28"
thiserror = { optional = true, version = "2.0" }
unic-langid = { features = [ "serde" ], version = "0.9" }

[dev-dependencies]
gpui = { features = [
  "test-support",
], git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }

[replace]
"https://github.com/zed-industries/zed#gpui@0.2.2" = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
"https://github.com/zed-industries/zed#gpui_macros@0.1.0" = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
