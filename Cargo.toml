[package]
name = "gpui-es-fluent"
description = "GPUI global-state integration helpers for es-fluent"
version = "0.1.0"
rust-version = "1.98"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/stayhydated/gpui-es-fluent"
readme = "README.md"

[workspace]
members = [ ".", "examples/gpui-demo", "web", "xtask" ]
resolver = "3"

[workspace.dependencies]
dioxus = { default-features = false, version = "0.7" }
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "809946144fe13b04a57ba17677c4c699143f4786" }

[features]
component = [ "dep:gpui-component", "dep:thiserror" ]
default = [  ]

[dependencies]
es-fluent = { git = "https://github.com/stayhydated/es-fluent", rev = "69aeaa62c03b23317be13d0ce0661f3160d62db7", version = "0.18.1" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent", rev = "69aeaa62c03b23317be13d0ce0661f3160d62db7", version = "0.18.1" }
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
gpui-component = { git = "https://github.com/stayhydated/gpui-component", optional = true, rev = "cdba027283fec36e37fb4b90dea862b1e116aa2d" }
strum = "0.28"
thiserror = { optional = true, version = "2.0" }
unic-langid = { features = [ "serde" ], version = "0.9" }

[dev-dependencies]
gpui = { branch = "linux-headless-renderer", features = [
  "test-support",
], git = "https://github.com/stayhydated/zed" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
