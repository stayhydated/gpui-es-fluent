[package]
name = "gpui-es-fluent"
description = "GPUI global-state integration helpers for es-fluent"
version.workspace = true
rust-version = "1.98"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/stayhydated/gpui-es-fluent"
readme = "README.md"

[workspace]
members = [ ".", "examples/gpui-demo", "web", "xtask" ]
resolver = "3"

[workspace.package]
version = "0.2.2"

[workspace.dependencies]
dioxus = { default-features = false, version = "0.7" }
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "fc2bbdb4755863c3d4112a2c015dd646016808a6" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "fc2bbdb4755863c3d4112a2c015dd646016808a6" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "fc2bbdb4755863c3d4112a2c015dd646016808a6" }

[features]
component = [ "gpui-kit/component", "dep:thiserror" ]
default = [  ]

[dependencies]
es-fluent = "0.20.3"
es-fluent-manager-embedded = "0.20.3"
gpui-kit = { default-features = false, version = "0.6.6" }
strum = "0.28"
thiserror = { optional = true, version = "2.0" }
unic-langid = { features = [ "serde" ], version = "0.9" }

[dev-dependencies]
gpui-kit = { default-features = false, features = [
  "test-support",
], version = "0.6.6" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
